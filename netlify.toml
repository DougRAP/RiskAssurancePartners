# Phase 2 review configuration — serves the design prototypes only.
# Replaced when the production app scaffold lands (Phase 5).
[build]
  publish = "prototype-ui"

# Prototypes are design review material — keep them out of search indexes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Site root serves the dealer home page.
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
